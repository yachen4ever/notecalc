name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  # 第一步：创建 GitHub Release（只有一个 job 创建，避免并发冲突）
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          # 从 CHANGELOG.md 提取当前 tag 对应版本的更新内容
          # 格式：## v0.6.0 (2026-08-11) 到下一个 ## 之间
          TAG="${GITHUB_REF_NAME}"
          # 提取该 tag 段落（从 "## $TAG" 到下一个 "## " 之间的内容）
          BODY=$(awk -v tag="## ${TAG}" '
            $0 ~ "^"tag { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' | sed 's/^[[:space:]]*$//' | sed -e :a -e '/./,$!d;/^\n*$/{$d;N;}' | sed -e 's/^\n//')
          if [ -z "$BODY" ]; then
            BODY="更新内容见 CHANGELOG.md。"
          fi
          # 输出到 GITHUB_ENV 供后续 step 使用
          {
            echo "BODY<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"
      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          body: ${{ env.BODY }}
          files: CHANGELOG.md

  # 第二步：跨平台并行构建
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          # Windows x86
          - os: windows-latest
            target: i686-pc-windows-msvc
            label: windows-x86
          # Linux amd64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-amd64
          # macOS arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          # Normalize to semver: 0.2-alpha.2 → 0.2.0-alpha.2, 0.2 → 0.2.0
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          # Windows MSI (WiX) requires numeric-only ProductVersion, so tauri.conf.json
          # uses the suffix-stripped version. Artifact filenames keep the full version.
          TAURI_VERSION="$VERSION"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TAURI_VERSION=$(echo "$VERSION" | sed -E 's/-.*$//')
          fi
          echo "Raw: $RAW → File: $VERSION, Tauri: $TAURI_VERSION (runner: $RUNNER_OS)"
          # Update tauri.conf.json
          if command -v jq &>/dev/null; then
            jq --arg v "$TAURI_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          else
            # macOS runners may not have jq pre-installed
            python3 -c "import json; f='src-tauri/tauri.conf.json'; d=json.load(open(f)); d['version']='$TAURI_VERSION'; json.dump(d, open(f,'w'), indent=2)"
          fi
          # Update package.json
          python3 -c "import json; f='package.json'; d=json.load(open(f)); d['version']='$TAURI_VERSION'; json.dump(d, open(f,'w'), indent=2)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Get version (full, for artifact filenames)
        id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar czf notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.tar.gz -C src-tauri/target/${{ matrix.target }}/release notecalc

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/notecalc.exe"
          Compress-Archive -Path $exe -DestinationPath "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.zip"
          Copy-Item $exe -Destination "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.exe"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.*

  # 第三步：构建 Linux deb 包
  build-deb:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          # Normalize to semver: 0.2-alpha.2 → 0.2.0-alpha.2, 0.2 → 0.2.0
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          echo "Raw: $RAW → Semver: $VERSION"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          python3 -c "import json; f='package.json'; d=json.load(open(f)); d['version']='$VERSION'; json.dump(d, open(f,'w'), indent=2)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build deb package
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu

      - name: Upload deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
