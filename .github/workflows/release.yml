name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  # 第一步：创建 GitHub Release（只有一个 job 创建，避免并发冲突）
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            ## ${{ github.ref_name }}

            跨平台编译产物，详见 Assets。

  # 第二步：跨平台并行构建
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          # Windows x86
          - os: windows-latest
            target: i686-pc-windows-msvc
            label: windows-x86
          # Linux amd64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-amd64
          # macOS arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (tar.gz for Linux/macOS)
        if: runner.os != 'Windows'
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Build Tauri (zip for Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Package binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          tar czf ../../../notecalc-${{ matrix.label }}.tar.gz notecalc

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/notecalc.exe" -DestinationPath "notecalc-${{ matrix.label }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notecalc-${{ matrix.label }}.tar.gz
            notecalc-${{ matrix.label }}.zip

  # 第三步：构建 Linux deb 包
  build-deb:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build deb package
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu

      - name: Upload deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
