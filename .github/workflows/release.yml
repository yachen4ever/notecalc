name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  # 第一步：创建 GitHub Release
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean up existing releases for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Checking for existing releases tagged $TAG..."
          RELEASE_IDS=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          if [ -n "$RELEASE_IDS" ]; then
            for id in $RELEASE_IDS; do
              echo "Deleting existing release $id..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
            done
          else
            echo "No existing releases found."
          fi
      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk -v tag="## ${TAG}" '
            $0 ~ "^"tag { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' | sed 's/^[[:space:]]*$//' | sed -e :a -e '/./,$!d;/^\n*$/{$d;N;}' | sed -e 's/^\n//')
          if [ -z "$BODY" ]; then
            BODY="更新内容见 CHANGELOG.md。"
          fi
          {
            echo "BODY<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"
      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          body: ${{ env.BODY }}
          files: CHANGELOG.md

  # 第二步：跨平台并行构建（含签名）
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            updater_target: windows-x86_64
          - os: windows-latest
            target: i686-pc-windows-msvc
            label: windows-x86
            updater_target: windows-i686
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-amd64
            updater_target: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            updater_target: darwin-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          TAURI_VERSION="$VERSION"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TAURI_VERSION=$(echo "$VERSION" | sed -E 's/-.*$//')
          fi
          echo "Raw: $RAW → File: $VERSION, Tauri: $TAURI_VERSION (runner: $RUNNER_OS)"
          if command -v jq &>/dev/null; then
            jq --arg v "$TAURI_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          else
            python3 -c "import json; f='src-tauri/tauri.conf.json'; d=json.load(open(f)); d['version']='$TAURI_VERSION'; json.dump(d, open(f,'w'), indent=2)"
          fi
          python3 -c "import json; f='package.json'; d=json.load(open(f)); d['version']='$TAURI_VERSION'; json.dump(d, open(f,'w'), indent=2)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (with updater signing)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Get version (full, for artifact filenames)
        id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar czf notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.tar.gz -C src-tauri/target/${{ matrix.target }}/release notecalc

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/notecalc.exe"
          Compress-Archive -Path $exe -DestinationPath "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.zip"
          Copy-Item $exe -Destination "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.exe"

      # 收集 updater 产物（签名后的安装包 + .sig 签名文件）
      - name: Collect updater artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          cp "$BUNDLE_DIR/notecalc.app.tar.gz" "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.app.tar.gz"
          cp "$BUNDLE_DIR/notecalc.app.tar.gz.sig" "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.app.tar.gz.sig"

      - name: Collect updater artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          if (Test-Path "$nsisDir") {
            $setup = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
            if ($setup) {
              Copy-Item $setup.FullName "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}-setup.exe"
              $sig = $setup.FullName + ".sig"
              if (Test-Path $sig) {
                Copy-Item $sig "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}-setup.exe.sig"
              }
            }
          }

      - name: Collect updater artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          APPIMAGE=$(find "$APPIMAGE_DIR" -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.AppImage"
            if [ -f "$APPIMAGE.sig" ]; then
              cp "$APPIMAGE.sig" "notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.AppImage.sig"
            fi
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}.*
            notecalc-${{ steps.ver.outputs.version }}-${{ matrix.label }}-setup.*

  # 第三步：构建 Linux deb 包
  build-deb:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          echo "Raw: $RAW → Semver: $VERSION"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          python3 -c "import json; f='package.json'; d=json.load(open(f)); d['version']='$VERSION'; json.dump(d, open(f,'w'), indent=2)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build deb package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu

      - name: Upload deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # 第四步：生成 latest.json + 同步到 Gitee
  publish-update:
    needs: [build, build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version info
        id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+)(-[a-zA-Z0-9.]+)?$/\1.0\2/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Download all .sig files from release
        run: |
          mkdir -p sigs
          gh release download ${{ steps.ver.outputs.tag }} --pattern "*.sig" --dir sigs/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          REPO="yachen4ever/notecalc"
          GH_BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Read signature files
          declare -A SIGS
          for f in sigs/*.sig; do
            if [[ "$f" == *"macos-arm64"* ]]; then
              SIGS[darwin-aarch64]=$(cat "$f")
            elif [[ "$f" == *"windows-x64"* ]]; then
              SIGS[windows-x86_64]=$(cat "$f")
            elif [[ "$f" == *"windows-x86"* ]]; then
              SIGS[windows-i686]=$(cat "$f")
            elif [[ "$f" == *"linux-amd64"* ]]; then
              SIGS[linux-x86_64]=$(cat "$f")
            fi
          done

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NOTES=$(awk -v tag="## ${TAG}" '
            $0 ~ "^"tag { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' | sed 's/^[[:space:]]*$//' | sed -e :a -e '/./,$!d;/^\n*$/{$d;N;}' | sed -e 's/^\n//' | head -20)
          if [ -z "$NOTES" ]; then
            NOTES="更新内容见 CHANGELOG.md"
          fi

          export VERSION NOTES PUB_DATE GH_BASE
          declare -p SIGS > /tmp/sigs.env
          python3 << 'PYEOF'
          import json, os, subprocess

          version = os.environ['VERSION']
          notes = os.environ['NOTES']
          pub_date = os.environ['PUB_DATE']
          gh_base = os.environ['GH_BASE']

          # Read signatures from the exported associative array
          sigs = {}
          sig_env = open('/tmp/sigs.env').read()
          # Parse BASH declare output for associative array
          import re
          for m in re.finditer(r'\[([^\]]+)\]="([^"]*)"', sig_env):
              sigs[m.group(1)] = m.group(2)

          platforms = {}
          url_map = {
              'darwin-aarch64': f'{gh_base}/notecalc-{version}-macos-arm64.app.tar.gz',
              'windows-x86_64': f'{gh_base}/notecalc-{version}-windows-x64-setup.exe',
              'windows-i686': f'{gh_base}/notecalc-{version}-windows-x86-setup.exe',
              'linux-x86_64': f'{gh_base}/notecalc-{version}-linux-amd64.AppImage',
          }
          for target, sig in sigs.items():
              if sig and target in url_map:
                  platforms[target] = {'signature': sig, 'url': url_map[target]}

          data = {
              'version': version,
              'notes': notes,
              'pub_date': pub_date,
              'platforms': platforms
          }
          with open('updates/latest.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PYEOF
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: Upload latest.json to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: updates/latest.json

      - name: Commit latest.json and sync to Gitee
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update latest.json for ${{ steps.ver.outputs.tag }}"
            git push
            # Sync to Gitee (for raw file access used by updater endpoint)
            git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/yachen/notecalc.git" 2>/dev/null || true
            git push gitee main || echo "Warning: Gitee push failed, latest.json may need manual sync"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
